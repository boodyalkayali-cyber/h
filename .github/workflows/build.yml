name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore folders from flat file names
        run: |
          for f in *~*; do
            [ -f "$f" ] || continue
            d="$(echo "$f" | tr '~' '/')"
            mkdir -p "$(dirname "$d")"
            mv "$f" "$d"
          done
          find . -name "*.kt" | head -3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Keep APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaseFiles-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CaseFiles.apk
          gh release create "build-${{ github.run_number }}" CaseFiles.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatic build from commit ${{ github.sha }}"
